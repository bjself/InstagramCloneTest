name: instagram_clone_flutter
description: Flutter frontend for Instagram Clone, connecting to the same Firebase backend as the React Native app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.18.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0

  # State management
  provider: ^6.1.1

  # Images
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7

  # Utilities
  intl: ^0.19.0
  timeago: ^3.6.1

  # Icons / UI
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
