name: instagram_clone_flutter
description: Flutter mobile client for the Instagram Clone app — connects to the same Firebase backend as the React Native app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0

  # State management
  provider: ^6.1.1

  # Navigation
  go_router: ^12.1.3

  # Image handling
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1

  # UI utilities
  timeago: ^3.6.0
  cupertino_icons: ^1.0.6
  video_player: ^2.8.2
  photo_view: ^0.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
