name: instagram_clone_flutter
description: Flutter front-end for Instagram Clone — shares Firebase backend with the React Native app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0

  # State management
  provider: ^6.1.1

  # Navigation
  go_router: ^13.2.0

  # Image / file picking
  image_picker: ^1.0.7

  # UI utilities
  cached_network_image: ^3.3.1
  timeago: ^3.6.1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  fake_cloud_firestore: ^2.4.1+1

flutter:
  uses-material-design: true
  assets:
    - assets/
